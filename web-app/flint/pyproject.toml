[project]
name = "spark-flint"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Flask==3.1.3",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "threadpoolctl==3.7.0",
]

[tool.vercel.scripts]
vercel-install = "python package-flint.py --install"
