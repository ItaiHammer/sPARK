# Weekly routine updates; security updates are managed in GitHub settings.
version: 2 # Dependabot's config format version.
updates:
  - package-ecosystem: "npm"
    directory: "/web-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1 # One open routine PR for this entry.
    allow: # Minor/patch releases only; major upgrades stay manual.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups: # Bundle matching updates into one PR.
      web-app-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message: # Use chore(deps): in commit messages.
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/extra/scraper-js"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      scraper-js-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Test saved Flint model compatibility before merging library updates.
  - package-ecosystem: "pip"
    directories:
      - "/lab"
      - "/web-app/flint"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      flint-and-lab-dependencies:
        group-by: "dependency-name" # One PR per library across both folders.
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/extra/scraper-py"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 1
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    groups:
      scraper-py-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"
